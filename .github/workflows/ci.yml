name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:package

  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: objy-org/objy
          path: .server-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Use release npm CLI
        run: |
          npm config delete always-auth --location=user
          npm install --global npm@12.2.1
      - run: npm ci
      - run: npm ci
        working-directory: .server-source
      - run: npx playwright install --with-deps
      - run: npm run test:all
        env:
          OBJY_SERVER_ROOT: ${{ github.workspace }}/.server-source
      - run: npm run check:package
      - run: npm pack
      - run: npm install --prefix "$RUNNER_TEMP/client-smoke" ./objy-client-*.tgz
      - name: Verify packed client import
        run: node --input-type=module -e 'import { pathToFileURL } from "node:url"; const client = await import(pathToFileURL(process.env.RUNNER_TEMP + "/client-smoke/node_modules/@objy/client/index.js")); if (typeof client.createClient !== "function") throw new Error("packed client does not export createClient");'
