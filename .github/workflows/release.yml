name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the v prefix
        required: true
        type: string
      npm_tag:
        description: npm distribution tag
        required: true
        default: alpha
        type: choice
        options: [alpha, beta, latest]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      NPM_TAG: ${{ inputs.npm_tag }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
      - run: npm pack
      - name: Publish npm package
        run: npm publish --tag "$NPM_TAG" --provenance --access public
      - name: Commit, tag, and publish GitHub release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release $RELEASE_VERSION"
          git push origin HEAD:main
          git tag -a "v$RELEASE_VERSION" -m "OBJY Client $RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" objy-client-*.tgz --generate-notes --verify-tag $([[ "$RELEASE_VERSION" == *-* ]] && echo --prerelease)
